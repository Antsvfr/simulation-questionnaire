<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Île des Agents</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Familjen+Grotesk:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : la scène 3D occupe tout l'écran ; un carnet de bord (panneau) glisse à droite, en feuille du bas sur téléphone. Look unique « fin d'après-midi sur le lagon ». */
:root{
  --sea:#0f3d47; --sky:#f2c48d; --paper:#fbf3e4; --ink:#2a2117; --muted:#7a6a55;
  --rule:#e4d5bb; --accent:#c4553a; --chip:#efe2c8;
  --display:"Caprasimo","Cooper Black",Georgia,serif;
  --body:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--sea);color:var(--ink);font-family:var(--body);font-size:15px}
#scene{position:fixed;inset:0}
#scene canvas{display:block;touch-action:none}
.labels{position:fixed;inset:0;pointer-events:none}
.lbl{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;
  background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;
  padding:3px 10px 4px;font-size:12px;font-weight:600;white-space:nowrap;box-shadow:0 2px 0 var(--ink);transition:transform .15s}
.lbl:hover,.lbl:focus-visible{transform:translate(-50%,-110%);outline:none}
.lbl.chantier{background:transparent;color:var(--paper);border-style:dashed;border-color:var(--paper);box-shadow:none;font-weight:500}
.lbl i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

header{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:max(16px,env(safe-area-inset-left,0px));
  color:var(--paper);pointer-events:none;max-width:min(420px,calc(100vw - 32px))}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,46px);line-height:.95;margin:0;letter-spacing:.5px;
  text-shadow:0 3px 0 rgba(0,0,0,.25)}
header p{margin:8px 0 0;font-size:14px;opacity:.9;line-height:1.4}

.chain{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:calc(100vw - 32px)}
.chain span{background:rgba(251,243,228,.92);color:var(--ink);padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600}
.chain b{color:var(--paper);font-weight:400}
.chain small{color:var(--paper);font-size:11px;opacity:.75;width:100%}

aside{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(env(safe-area-inset-bottom,0px) + 16px);width:360px;background:var(--paper);border:2px solid var(--ink);
  border-radius:14px;box-shadow:6px 6px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;overflow:hidden;
  transform:translateX(0);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
aside.closed{transform:translateX(calc(100% + 40px))}
.ph{padding:18px 20px 14px;border-bottom:1.5px dashed var(--rule);position:relative}
.kind{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ph h2{font-family:var(--display);font-weight:400;font-size:28px;line-height:1.05;margin:6px 0 0;text-wrap:balance}
.swatch{position:absolute;top:18px;right:52px;width:22px;height:22px;border-radius:5px;border:1.5px solid var(--ink)}
.x{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:8px;border:1.5px solid var(--ink);
  background:var(--chip);color:var(--ink);font-size:16px;cursor:pointer;line-height:1}
.x:focus-visible,.lbl:focus-visible,.nav button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pb{padding:16px 20px 20px;overflow:auto;display:flex;flex-direction:column;gap:16px}
.pb p{margin:0;line-height:1.5}
.f{display:flex;flex-direction:column;gap:6px}
.f > span{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
code{font-family:var(--mono);font-size:12.5px;background:var(--chip);padding:2px 6px;border-radius:4px;word-break:break-all}
ul.env{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:5px}
ul.env li{font-family:var(--mono);font-size:12.5px;padding:6px 9px;border:1px solid var(--rule);border-radius:6px;background:#fff8ec}
.cmd{display:flex;gap:8px;align-items:center}
.cmd code{flex:1;padding:8px 10px}
.cmd button{border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:6px;padding:7px 10px;font:600 12px var(--body);cursor:pointer}
.tag{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;border:1.5px dashed var(--accent);color:var(--accent)}
.nav{display:flex;gap:8px;padding:12px 20px;border-top:1.5px dashed var(--rule)}
.nav button{flex:1;border:1.5px solid var(--ink);background:var(--chip);color:var(--ink);border-radius:8px;padding:8px;font:600 13px var(--body);cursor:pointer}
.open{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 16px);
  border:2px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:10px;padding:8px 12px;font:600 13px var(--body);cursor:pointer;box-shadow:3px 3px 0 rgba(0,0,0,.35)}
@media (max-width:720px){
  aside{top:auto;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;max-height:56%}
  aside.closed{transform:translateY(calc(100% + 40px))}
  .chain{display:none}
  header p{display:none}
}
@media (prefers-reduced-motion:reduce){aside,.lbl{transition:none}}
</style>
</head>
<body>
<div id="scene" aria-label="Carte 3D de l'île : glisse pour tourner, pince ou molette pour zoomer"></div>
<div class="labels" id="labels"></div>

<header>
  <h1>Île des Agents</h1>
  <p>Chaque bâtiment est un agent Claude Code. Clique sur une maison pour voir son rôle, son dossier et la commande à lancer.</p>
</header>

<div class="chain" aria-label="Circuit d'une demande">
  <small>Circuit d'une demande — suis les messagers</small>
  <span>Mairie</span><b>→</b><span>Conseil ×3</span><b>→</b><span>Maison</span><b>→</b><span>Forge</span><b>→</b><span>Mairie</span>
</div>

<button class="open" id="open" hidden>Carnet de l'île</button>
<aside id="panel" aria-live="polite">
  <div class="ph">
    <div class="kind" id="pKind"></div>
    <h2 id="pName"></h2>
    <div class="swatch" id="pSw"></div>
    <button class="x" id="close" aria-label="Fermer le carnet">✕</button>
  </div>
  <div class="pb" id="pBody"></div>
  <div class="nav"><button id="prev">← Précédent</button><button id="next">Suivant →</button></div>
</aside>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
const FALLBACK = {"ile": "Île des Agents", "version": 1, "batiments": [{"id": "mairie", "nom": "Mairie", "type": "mairie", "pos": [0, 0], "couleur": "#c4553a", "agent": "Session principale (CLAUDE.md)", "role": "Le Maire reçoit chaque demande, la fait passer au Conseil, la confie à la bonne maison, puis demande à la Forge de vérifier avant de te répondre.", "dossier": ".", "environnement": ["CLAUDE.md : la constitution de l'île", "registre.json : le cadastre", "journal-de-l-ile.md : l'histoire de l'île"], "commande": "claude"}, {"id": "conseil", "nom": "Conseil des Critiques", "type": "conseil", "pos": [-6, -5], "couleur": "#6b4fa0", "agent": ".claude/agents/critique-*.md (×3)", "role": "Trois tours, trois critiques qui relisent chaque prompt en parallèle. Le Maire fusionne leurs avis en un prompt amélioré.", "dossier": "conseil", "environnement": ["Tour de la Clarté : ambiguïtés, reformulation", "Tour de l'Exigence : barre de qualité, pièges", "Tour Stratège : objectif réel, priorités", "proces-verbaux/ : chaque avis rendu"], "commande": "/conseil <ton prompt>"}, {"id": "forge", "nom": "La Forge", "type": "forge", "pos": [7, -6], "couleur": "#3d3a36", "agent": ".claude/agents/forgeron.md", "role": "Vérifie et répare tout ce qui sort des maisons : structure, fichiers manquants, code qui casse, chiffres sans source. Inspecte aussi l'île automatiquement à la fin de chaque tâche.", "dossier": "forge", "environnement": ["inspection.sh : contrôle de toute l'île", "rapports/ : un rapport par inspection", "Hook de fin de tâche : réparation automatique"], "commande": "/inspection"}, {"id": "cuvee-campus", "nom": "Cave Cuvée Campus", "type": "maison", "pos": [-8, 4], "couleur": "#7d2e46", "agent": ".claude/agents/chef-cuvee-campus.md", "role": "Projet sociétal environnemental de l'équipe 53 : livrables, recherches sourcées, suivi d'équipe.", "dossier": "maisons/cuvee-campus", "environnement": ["livrables/", "recherches/", "equipe.md", "journal.md"], "commande": "Utilise chef-cuvee-campus pour …"}, {"id": "bde-emergency", "nom": "QG EM'ERGENCY", "type": "maison", "pos": [-2, 8], "couleur": "#d6402b", "agent": ".claude/agents/chef-bde-emergency.md", "role": "Campagne BDE BBA : programme chiffré, entraînement à l'entretien de candidature, communication de la liste.", "dossier": "maisons/bde-emergency", "environnement": ["programme/", "entretien/", "com/", "journal.md"], "commande": "Utilise chef-bde-emergency pour …"}, {"id": "vetotri", "nom": "Labo Vétotri", "type": "maison", "pos": [5, 7], "couleur": "#2f8f83", "agent": ".claude/agents/chef-vetotri.md", "role": "Ton chatbot : code, prompts système versionnés, tests, recherche d'un nouveau nom.", "dossier": "maisons/vetotri", "environnement": ["src/", "prompts/", "tests/", "noms.md", "journal.md"], "commande": "Utilise chef-vetotri pour …"}, {"id": "ecole", "nom": "École", "type": "maison", "pos": [9, 1], "couleur": "#2e5c9e", "agent": ".claude/agents/chef-ecole.md", "role": "Cours emlyon : présentation d'anglais sur Lester Piggott, « Analyser et comprendre le marché », fiches de révision.", "dossier": "maisons/ecole", "environnement": ["anglais/", "marche/", "fiches/", "journal.md"], "commande": "Utilise chef-ecole pour …"}, {"id": "bibliotheque", "nom": "Bibliothèque", "type": "chantier", "pos": [-2, -11], "couleur": "#a0703c", "agent": "à construire", "dossier": "", "role": "Mémoire de l'île : résumés de cours, sources, notes de lecture, tout ce que les maisons ont appris. Les chefs viennent y chercher avant de refaire une recherche.", "environnement": ["index.md", "sources/", "resumes/"], "commande": "/nouvelle-maison Bibliothèque"}, {"id": "phare", "nom": "Phare", "type": "chantier", "pos": [10, -10], "couleur": "#e0b23a", "agent": "à construire", "dossier": "", "role": "Veille et alertes : échéances de toutes les maisons, rappels planifiés, brief du matin sur ce qui arrive cette semaine.", "environnement": ["echeances.md", "tâches planifiées"], "commande": "/nouvelle-maison Phare"}, {"id": "port", "nom": "Port", "type": "chantier", "pos": [-13, 1], "couleur": "#4a7fa8", "agent": "à construire", "dossier": "", "role": "Ce qui part de l'île : mails, posts, messages d'équipe. Rien n'est envoyé sans ton feu vert.", "environnement": ["brouillons/", "envoyes.md"], "commande": "/nouvelle-maison Port"}, {"id": "observatoire", "nom": "Observatoire", "type": "chantier", "pos": [12, 6], "couleur": "#5a4a8a", "agent": "à construire", "dossier": "", "role": "Données et tableaux de bord : avancement de chaque maison, stats d'utilisation de Vétotri, budget de la liste BDE.", "environnement": ["donnees/", "dashboards/"], "commande": "/nouvelle-maison Observatoire"}, {"id": "academie", "nom": "Académie", "type": "chantier", "pos": [-10, -8], "couleur": "#3f8a4e", "agent": "à construire", "dossier": "", "role": "Entraînement : quiz, flashcards, simulations d'oral et d'entretien, à partir de ce que contiennent les autres maisons.", "environnement": ["quiz/", "simulations/"], "commande": "/nouvelle-maison Académie"}]};
const KINDS = {mairie:"Mairie · orchestrateur", conseil:"Conseil · 3 critiques", forge:"Forge · vérification & réparation", maison:"Maison · chef de projet", chantier:"Chantier · branche proposée"};

async function chargerRegistre(){
  try{ const r = await fetch("../registre.json",{cache:"no-store"}); if(r.ok) return await r.json(); }catch(e){}
  return FALLBACK;
}

chargerRegistre().then(REG => {
const B = REG.batiments;
const host = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#f2c48d");
scene.fog = new THREE.Fog("#f2c48d", 60, 150);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .1, 400);
camera.position.set(30, 26, 32);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0,1,0);
controls.minDistance = 14; controls.maxDistance = 80; controls.maxPolarAngle = 1.32;
controls.autoRotate = !matchMedia("(prefers-reduced-motion: reduce)").matches; controls.autoRotateSpeed = .35;

scene.add(new THREE.HemisphereLight("#ffe7c4", "#2a5b4f", .75));
const sun = new THREE.DirectionalLight("#ffd9a8", 1.15);
sun.position.set(-30, 40, 20); sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-25,right:25,top:25,bottom:-25,near:1,far:120});
scene.add(sun);

const mat = c => new THREE.MeshStandardMaterial({color:c, flatShading:true, roughness:.85});
function mesh(geo, color, x=0,y=0,z=0, parent=scene){
  const m = new THREE.Mesh(geo, typeof color==="string"?mat(color):color);
  m.position.set(x,y,z); m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
// pseudo-aléatoire stable
let seed = 7; const rnd = () => (seed = (seed*16807)%2147483647)/2147483647;

// Mer
const seaGeo = new THREE.PlaneGeometry(400,400,90,90); seaGeo.rotateX(-Math.PI/2);
const sea = new THREE.Mesh(seaGeo, new THREE.MeshStandardMaterial({color:"#1d6b73",flatShading:true,roughness:.4,metalness:.1}));
sea.position.y = -.6; sea.receiveShadow = true; scene.add(sea);
const seaBase = seaGeo.attributes.position.array.slice();

// Île : sable, herbe, colline
function jitter(geo, amt){
  const p = geo.attributes.position;
  for(let i=0;i<p.count;i++){ const x=p.getX(i), z=p.getZ(i); const k=1+(Math.sin(x*1.7+z*.9)*.5+Math.cos(z*1.3-x*.4)*.5)*amt; p.setX(i,x*k); p.setZ(i,z*k); }
  geo.computeVertexNormals(); return geo;
}
mesh(jitter(new THREE.CylinderGeometry(18.5,22,2.2,30,2),.05), "#e8cf9a", 0,-.4,0);
mesh(jitter(new THREE.CylinderGeometry(15.6,17.2,1.2,26,1),.06), "#6f9e4c", 0,1.1,0);
mesh(new THREE.ConeGeometry(4.5,4,7), "#5f8c42", 13,1.6,-1).scale.set(1,.7,1);
// rochers
for(let i=0;i<14;i++){ const a=rnd()*6.28, r=19+rnd()*3; mesh(new THREE.DodecahedronGeometry(.5+rnd()*.9,0), "#8a8172", Math.cos(a)*r,-.1,Math.sin(a)*r); }

const GROUND = 1.7;
const clickables = [];

function maison(g, c){
  mesh(new THREE.BoxGeometry(2.6,2,2.6), "#f3e6cf", 0,1,0, g);
  const roof = mesh(new THREE.ConeGeometry(2.35,1.7,4), c, 0,2.85,0, g); roof.rotation.y = Math.PI/4;
  mesh(new THREE.BoxGeometry(.7,1.1,.1), "#4a3424", 0,.55,1.31, g);
  mesh(new THREE.BoxGeometry(.6,.55,.1), "#ffd98a", .85,1.25,1.31, g);
  mesh(new THREE.BoxGeometry(.6,.55,.1), "#ffd98a", -.85,1.25,1.31, g);
  mesh(new THREE.BoxGeometry(.35,1,.35), c, .8,3,-.6, g);
}
function mairie(g, c){
  mesh(new THREE.BoxGeometry(5,2.6,3.6), "#f6ead6", 0,1.3,0, g);
  mesh(new THREE.BoxGeometry(5.4,.35,4), c, 0,2.75,0, g);
  mesh(new THREE.BoxGeometry(1.6,3,1.6), "#f6ead6", 0,4.4,0, g);
  mesh(new THREE.CylinderGeometry(.55,.55,.1,16), "#fffaf0", 0,4.9,.82, g).rotation.x = Math.PI/2;
  const r = mesh(new THREE.ConeGeometry(1.3,1.6,4), c, 0,6.7,0, g); r.rotation.y = Math.PI/4;
  mesh(new THREE.CylinderGeometry(.04,.04,1.6,6), "#3a2c20", 0,8.2,0, g);
  const flag = mesh(new THREE.BoxGeometry(.9,.5,.03), "#e0b23a", .45,8.7,0, g); g.userData.flag = flag;
  for(let i=-1;i<=1;i++) mesh(new THREE.BoxGeometry(.8,1.1,.1), "#ffd98a", i*1.5,1.4,1.81, g);
  mesh(new THREE.BoxGeometry(5.6,.3,4.4), "#d9c8a8", 0,.05,0, g);
}
function conseil(g, c){
  mesh(new THREE.CylinderGeometry(3.6,3.9,.4,20), "#d9c8a8", 0,.2,0, g);
  const cols = ["#6b4fa0","#8a5fb0","#4f3a80"];
  for(let i=0;i<3;i++){
    const a = i*2.094+.5, x=Math.cos(a)*2, z=Math.sin(a)*2, h=3.2+i*.6;
    mesh(new THREE.CylinderGeometry(.75,.9,h,8), "#efe2cb", x,h/2+.4,z, g);
    mesh(new THREE.ConeGeometry(1.05,1.5,8), cols[i], x,h+1.15,z, g);
    mesh(new THREE.BoxGeometry(.35,.5,.1), "#ffd98a", x+Math.cos(a)*.0,h*.7,z+.86, g);
  }
  const orb = mesh(new THREE.IcosahedronGeometry(.45,0), new THREE.MeshStandardMaterial({color:"#c9b6ff",emissive:"#6b4fa0",emissiveIntensity:.8,flatShading:true}), 0,2.2,0, g);
  g.userData.orb = orb;
}
const smoke = [];
function forge(g, c){
  mesh(new THREE.BoxGeometry(3.8,2.3,3), "#7d7468", 0,1.15,0, g);
  const r = mesh(new THREE.BoxGeometry(4.2,.4,3.4), "#3d3a36", 0,2.5,0, g);
  mesh(new THREE.CylinderGeometry(.45,.55,3,8), "#5e564c", 1.2,3.6,-.6, g);
  mesh(new THREE.BoxGeometry(1.4,1.2,.1), new THREE.MeshStandardMaterial({color:"#ff8a3d",emissive:"#ff5a1f",emissiveIntensity:1.2}), 0,.75,1.51, g);
  mesh(new THREE.BoxGeometry(1,.5,.6), "#2b2926", -2.6,.4,1.2, g);
  mesh(new THREE.BoxGeometry(1.3,.25,.5), "#2b2926", -2.6,.75,1.2, g);
  const light = new THREE.PointLight("#ff7a2e", 1.4, 9); light.position.set(0,1,2.4); g.add(light); g.userData.glow = light;
  for(let i=0;i<7;i++){
    const s = new THREE.Mesh(new THREE.IcosahedronGeometry(.4,0), new THREE.MeshStandardMaterial({color:"#cfc6ba",transparent:true,opacity:.7,flatShading:true}));
    s.userData.t = i/7; g.add(s); smoke.push(s);
  }
}
function chantier(g, c){
  const ghost = new THREE.MeshStandardMaterial({color:c,transparent:true,opacity:.28,flatShading:true});
  mesh(new THREE.BoxGeometry(2.6,2,2.6), ghost, 0,1,0, g);
  const roof = mesh(new THREE.ConeGeometry(2.35,1.7,4), ghost, 0,2.85,0, g); roof.rotation.y = Math.PI/4;
  for(const [x,z] of [[-1.6,-1.6],[1.6,-1.6],[1.6,1.6],[-1.6,1.6]]) mesh(new THREE.BoxGeometry(.18,1,.18), "#a07a4e", x,.5,z, g);
  mesh(new THREE.BoxGeometry(.12,1.4,.12), "#7a5a36", 1.9,.7,1.9, g);
  mesh(new THREE.BoxGeometry(1,.6,.08), "#f3e6cf", 1.9,1.4,1.95, g);
}
const builders = {maison, mairie, conseil, forge, chantier};

const groups = {};
B.forEach(b => {
  const g = new THREE.Group(); g.position.set(b.pos[0], GROUND, b.pos[1]);
  g.rotation.y = Math.atan2(-b.pos[0], -b.pos[1]) + Math.PI;  // façade tournée vers la mairie
  if(b.type==="mairie") g.rotation.y = .5;
  (builders[b.type]||maison)(g, b.couleur);
  g.traverse(o => { if(o.isMesh) o.userData.bid = b.id; });
  scene.add(g); groups[b.id] = g; clickables.push(g);
});

// Chemins de pierres depuis la mairie
const stoneMat = mat("#d8c4a0");
B.forEach(b => {
  if(b.type==="mairie") return;
  const [x,z] = b.pos, d = Math.hypot(x,z), n = Math.floor(d/1.1);
  for(let i=2;i<n-1;i++){
    const t=i/n, s = new THREE.Mesh(new THREE.CylinderGeometry(.32,.36,.12,6), stoneMat);
    s.position.set(x*t + (rnd()-.5)*.25, GROUND+.02, z*t + (rnd()-.5)*.25); s.receiveShadow = true;
    if(b.type==="chantier" && i%2) continue;
    scene.add(s);
  }
});

// Palmiers
function palmier(x,z){
  const g = new THREE.Group(); g.position.set(x,GROUND,z); const h = 2.6+rnd()*1.6; const lean = (rnd()-.5)*.5;
  const trunk = mesh(new THREE.CylinderGeometry(.13,.2,h,6), "#8a6a44", 0,h/2,0, g); trunk.rotation.z = lean;
  const top = new THREE.Vector3(-Math.sin(lean)*h/2*1.0, h, 0);
  for(let i=0;i<6;i++){
    const leaf = mesh(new THREE.ConeGeometry(.35,2.2,4), "#3f7a3a", top.x,top.y,top.z, g);
    leaf.rotation.z = Math.PI/2.4; leaf.rotation.y = i*1.047; leaf.geometry.translate(0,1.1,0);
  }
  g.rotation.y = rnd()*6.28; scene.add(g);
}
const occupied = B.map(b=>b.pos);
for(let k=0;k<60 && occupied.length<B.length+24;k++){
  const a=rnd()*6.28, r=6+rnd()*9, x=Math.cos(a)*r, z=Math.sin(a)*r;
  if(occupied.every(([ox,oz])=>Math.hypot(ox-x,oz-z)>3.4) && Math.hypot(x-13,z+1)>4){ occupied.push([x,z]); palmier(x,z); }
}

// Messagers : suivent le circuit Mairie → Conseil → Maison → Forge → Mairie
const maisons = B.filter(b=>b.type==="maison");
const P = id => { const b=B.find(x=>x.id===id); return b ? new THREE.Vector3(b.pos[0],GROUND+.5,b.pos[1]) : new THREE.Vector3(); };
const messengers = [];
const stageColors = ["#e0b23a","#8a5fb0","#ffffff","#ff7a2e"];
for(let i=0;i<Math.max(3,maisons.length);i++){
  const g = new THREE.Group();
  const body = mesh(new THREE.CylinderGeometry(.18,.26,.6,8), "#f3e6cf", 0,.3,0, g);
  const head = mesh(new THREE.SphereGeometry(.2,8,6), "#e8b98a", 0,.8,0, g);
  const scroll = mesh(new THREE.BoxGeometry(.24,.24,.24), "#e0b23a", 0,1.25,0, g);
  g.userData = {scroll, house: maisons[i % maisons.length]?.id, leg:0, t: i*.27, speed:.32+rnd()*.12};
  scene.add(g); messengers.push(g);
}
function route(m){ return [P("mairie"), P("conseil"), P(m.userData.house), P("forge"), P("mairie")]; }

// Étiquettes HTML
const labelsEl = document.getElementById("labels");
const labels = B.map(b => {
  const el = document.createElement("button");
  el.className = "lbl" + (b.type==="chantier" ? " chantier" : "");
  el.innerHTML = (b.type==="chantier" ? "" : `<i style="background:${b.couleur}"></i>`) + b.nom;
  el.addEventListener("click", () => ouvrir(b.id));
  labelsEl.appendChild(el);
  const h = {mairie:9.6, conseil:6.6, forge:5.4}[b.type] || 4.4;
  return {el, v:new THREE.Vector3(b.pos[0], GROUND+h, b.pos[1])};
});

// Panneau
const panel = document.getElementById("panel"), openBtn = document.getElementById("open");
let current = 0;
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function ouvrir(id){
  current = B.findIndex(b=>b.id===id); const b = B[current];
  document.getElementById("pKind").textContent = KINDS[b.type] || b.type;
  document.getElementById("pName").textContent = b.nom;
  document.getElementById("pSw").style.background = b.couleur;
  document.getElementById("pBody").innerHTML = `
    ${b.type==="chantier" ? '<span class="tag">Branche proposée · pas encore construite</span>' : ''}
    <p>${esc(b.role)}</p>
    <div class="f"><span>Agent</span><code>${esc(b.agent)}</code></div>
    ${b.dossier ? `<div class="f"><span>Dossier</span><code>${esc(b.dossier === "." ? "/ (racine)" : b.dossier + "/")}</code></div>` : ""}
    <div class="f"><span>${b.type==="chantier" ? "Environnement prévu" : "Environnement"}</span><ul class="env">${(b.environnement||[]).map(e=>`<li>${esc(e)}</li>`).join("")}</ul></div>
    <div class="f"><span>Dans Claude Code</span><div class="cmd"><code id="cmdTxt">${esc(b.commande)}</code><button id="copy">Copier</button></div></div>`;
  document.getElementById("copy").onclick = async (e) => {
    try{ await navigator.clipboard.writeText(b.commande); e.target.textContent = "Copié"; }
    catch{ const r=document.createRange(); r.selectNodeContents(document.getElementById("cmdTxt")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); e.target.textContent="Sélectionné"; }
  };
  panel.classList.remove("closed"); openBtn.hidden = true;
  focusTarget.copy(groups[b.id].position); focusTarget.y = 1.5; focusing = 1;
  controls.autoRotate = false;
}
document.getElementById("close").onclick = () => { panel.classList.add("closed"); openBtn.hidden = false; };
openBtn.onclick = () => ouvrir(B[current].id);
document.getElementById("prev").onclick = () => ouvrir(B[(current-1+B.length)%B.length].id);
document.getElementById("next").onclick = () => ouvrir(B[(current+1)%B.length].id);

// Clic dans la scène
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2(); let down = null;
renderer.domElement.addEventListener("pointerdown", e => down = [e.clientX, e.clientY]);
renderer.domElement.addEventListener("pointerup", e => {
  if(!down || Math.hypot(e.clientX-down[0], e.clientY-down[1]) > 6) return;
  ptr.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(clickables, true).find(h => h.object.userData.bid);
  if(hit) ouvrir(hit.object.userData.bid);
});

const focusTarget = new THREE.Vector3(); let focusing = 0;
addEventListener("resize", () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

const clock = new THREE.Clock(), tmp = new THREE.Vector3();
function frame(){
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  // vagues
  const p = seaGeo.attributes.position.array;
  for(let i=0;i<p.length;i+=3){ const x=seaBase[i], z=seaBase[i+2]; p[i+1] = Math.sin(x*.12+t*.9)*.28 + Math.cos(z*.15+t*.7)*.22; }
  seaGeo.attributes.position.needsUpdate = true; seaGeo.computeVertexNormals();
  // fumée de la forge
  smoke.forEach(s => { s.userData.t = (s.userData.t + dt*.22) % 1; const k=s.userData.t;
    s.position.set(1.2 + Math.sin(k*6+t)*.3, 5 + k*4.5, -.6); s.scale.setScalar(.5 + k*1.6); s.material.opacity = .7*(1-k); });
  const f = groups.forge?.userData.glow; if(f) f.intensity = 1.2 + Math.sin(t*9)*.25 + Math.sin(t*23)*.15;
  const orb = groups.conseil?.userData.orb; if(orb){ orb.rotation.y += dt; orb.position.y = 2.2 + Math.sin(t*1.5)*.25; }
  const flag = groups.mairie?.userData.flag; if(flag) flag.rotation.y = Math.sin(t*2.2)*.35;
  // messagers
  messengers.forEach(m => {
    const r = route(m), u = m.userData; u.t += dt*u.speed;
    if(u.t >= 1){ u.t = 0; u.leg = (u.leg+1) % (r.length-1); if(u.leg===0) u.house = maisons[Math.floor(rnd()*maisons.length)]?.id; }
    const a = r[u.leg], b = r[u.leg+1];
    tmp.lerpVectors(a, b, u.t); tmp.y = GROUND + Math.abs(Math.sin(u.t*Math.PI*10))*.12;
    m.position.copy(tmp); m.lookAt(b.x, m.position.y, b.z);
    u.scroll.material.color.set(stageColors[u.leg]); u.scroll.rotation.y += dt*3;
    m.visible = u.t > .06 && u.t < .94;
  });
  if(focusing > 0){ controls.target.lerp(focusTarget, .06); focusing -= dt*.6; }
  controls.update();
  renderer.render(scene, camera);
  // étiquettes
  labels.forEach(({el,v}) => {
    tmp.copy(v).project(camera);
    const vis = tmp.z < 1 && Math.abs(tmp.x) < 1.1 && Math.abs(tmp.y) < 1.1;
    el.style.display = vis ? "" : "none";
    if(vis){ el.style.left = ((tmp.x+1)/2*innerWidth) + "px"; el.style.top = ((1-tmp.y)/2*innerHeight) + "px"; }
  });
  requestAnimationFrame(frame);
}
ouvrir("mairie");
if(innerWidth < 720){ panel.classList.add("closed"); openBtn.hidden = false; }
frame();
});
</script>
</body>
</html>
